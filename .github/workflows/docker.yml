# Same reusable multi-architecture build workflow used by FyraLabs/subatomic.
name: Docker container

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    uses: FyraLabs/actions/.github/workflows/docker.yml@2c3af61a6d74f43a802f9b91487d33e302d4de00
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      # Build PRs without publishing; only publish pushes to this repository.
      publish: ${{ github.event_name == 'push' }}
