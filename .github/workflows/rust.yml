# Adapted from FyraLabs/subatomic; this crate does not require nightly or services.
name: Rust

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/terrapkg/builder:f44
    steps:
      - name: Install build dependencies
        run: dnf install -y gcc git
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: clippy
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/
            target
          key: ${{ runner.os }}-cargo-clippy-stable-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-stable-
      - name: Check Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  coverage:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/terrapkg/builder:f44
    steps:
      - name: Install build dependencies
        run: dnf install -y gcc git
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/
            target
          key: ${{ runner.os }}-cargo-coverage-stable-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-stable-
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ea647c55f74bb153499600c054578c0d83fa19d5
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Run tests with coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --locked --workspace --all-targets --all-features --no-report
      - name: Generate coverage reports
        run: |
          mkdir -p target/coverage
          cargo llvm-cov report --lcov --output-path target/coverage/lcov.info
          cargo llvm-cov report --html --output-dir target/coverage
          cargo llvm-cov report --summary-only
      - name: Upload coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: target/coverage
          if-no-files-found: error
